# Rebuilds the national snapshot from planning.data.gov.uk every Monday morning,
# and on demand: GitHub -> Actions -> "Update tracker" -> Run workflow.
name: Update tracker

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build snapshot
        run: python scripts/build_tracker.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data js/data.js && [ -z "$(git status --porcelain data js/data.js)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data js/data.js
          git commit -m "Update tracker snapshot"
          git push
